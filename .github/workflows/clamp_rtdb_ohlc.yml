name: Clamp RTDB OHLC coherence

# Manually-triggered per-field OHLC coherence fix.
# Catches the pattern fix_decimal_scale.py misses: a row where only Low or
# High is decimal-shifted (e.g. KCB 2026-09-16 Low=25.0 with Close=84.25).
# Default: report-only (no writes). Toggle `apply` to persist fixes.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Restrict to specific ticker (leave blank for all)"
        required: false
        default: ""
      apply:
        description: "Actually write fixes to RTDB (default: report-only)"
        required: false
        default: "false"

jobs:
  clamp:
    name: Clamp OHLC coherence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run clamp
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL:             ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          FLAGS=""
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            FLAGS="$FLAGS --ticker ${{ github.event.inputs.ticker }}"
          fi
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            FLAGS="$FLAGS --apply"
          fi
          echo "Running: python pipeline/scripts/clamp_rtdb_ohlc.py $FLAGS"
          python pipeline/scripts/clamp_rtdb_ohlc.py $FLAGS 2>&1 | tee /tmp/clamp_ohlc.log

      - name: Upload log + backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clamp-ohlc-${{ github.run_id }}
          path: |
            /tmp/clamp_ohlc.log
            rtdb_ohlc_backup.json
          retention-days: 30
