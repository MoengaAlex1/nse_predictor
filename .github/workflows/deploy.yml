name: Deploy Frontend to Cloudflare

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
        run: npm run build

      # Guard: the Worker previously served the source tree, whose index.html
      # points at /src/main.tsx and renders blank. Fail loudly rather than
      # shipping that again.
      - name: Verify build output
        run: |
          test -f frontend/dist/index.html
          grep -q '/assets/index-.*\.js' frontend/dist/index.html
          ! grep -q '/src/main.tsx' frontend/dist/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned: the runner's pre-installed wrangler 3.90.0 does not parse
          # _headers/_redirects for Workers assets, it uploads them as files.
          wranglerVersion: "4"
          command: pages deploy frontend/dist --project-name=nse-market-dashboard --branch=master

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc

      # Smoke-test the live Worker. Catches the two failure modes seen so far:
      # serving the source tree, and _headers being uploaded rather than parsed.
      - name: Smoke test the deployed Worker
        run: |
          URL=https://nse-predictor.moengaalex.workers.dev
          for i in 1 2 3 4 5; do
            BUNDLE=$(curl -sSf "$URL/" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1) && break
            echo "retry $i"; sleep 5
          done
          test -n "$BUNDLE" || { echo "no hashed bundle in index.html"; exit 1; }
          curl -sSf -o /dev/null "$URL$BUNDLE"
          curl -sSI "$URL/" | grep -qi '^x-frame-options: DENY' \
            || { echo "_headers not applied - is wrangler too old?"; exit 1; }
          curl -sS -o /dev/null -w '%{http_code}' "$URL/_headers" | grep -qv '^200$' \
            || echo "note: /_headers is served as an asset"
          echo "smoke test passed: $BUNDLE"
