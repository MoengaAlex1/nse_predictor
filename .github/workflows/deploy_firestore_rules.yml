name: Deploy Firestore rules

on:
  push:
    branches: [master]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy_firestore_rules.yml"
      - "pipeline/scripts/deploy_firestore_rules.py"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install google-auth requests

      - name: Deploy Firestore rules via REST API
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: nse-market-dashboard
        run: python pipeline/scripts/deploy_firestore_rules.py
