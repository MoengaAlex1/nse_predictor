name: Deploy Firestore rules

on:
  push:
    branches: [master]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy_firestore_rules.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      - name: Deploy Firestore rules
        env:
          # Project id is baked into the SA cert; --project flag makes the
          # target explicit so a wrong-project deploy fails loudly instead
          # of picking the first project the SA has access to.
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: firebase deploy --only firestore:rules --project nse-market-dashboard --non-interactive
