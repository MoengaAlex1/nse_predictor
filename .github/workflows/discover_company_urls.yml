name: Discover company website URLs

# Probes candidate domain patterns for every NSE-listed ticker whose
# source_url isn't already curated, then commits the discovered URLs
# back into pipeline/config/fundamentals.json. Downstream:
# enrich_from_ir_pages.py picks up the new URLs on its next run and
# extracts CEO / Chairperson / board via NVIDIA.
#
# Runs weekly. Manual dispatch supports --only-missing (default true)
# to skip tickers already curated, or a specific ticker list.

on:
  schedule:
    - cron: "30 5 * * 2"   # Tuesday 05:30 UTC = 08:30 EAT (right after scrape_nse_listed_companies)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers (blank = all)"
        required: false
        default: ""
      only_missing:
        description: "Skip tickers that already have source_url"
        required: false
        default: "true"

concurrency:
  group: discover-company-urls
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write access for the commit-back step below.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Run discover_company_urls.py
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL:             ${{ secrets.FIREBASE_RTDB_URL }}
          FIREBASE_STORAGE_BUCKET:       ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ github.event.inputs.tickers }}"
          fi
          if [ "${{ github.event.inputs.only_missing }}" != "false" ]; then
            ARGS="$ARGS --only-missing"
          fi
          python pipeline/scripts/discover_company_urls.py $ARGS

      - name: Commit discovered URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet pipeline/config/fundamentals.json; then
            echo "No URL changes to commit."
            exit 0
          fi
          git add pipeline/config/fundamentals.json
          git commit -m "chore(pipeline): auto-discovered company URLs

$(python -c 'import json; d=json.load(open(\"pipeline/config/fundamentals.json\")); n=sum(1 for k,v in d.items() if k!=\"_meta\" and (v or {}).get(\"method\")==\"url_discovery\"); print(f\"{n} tickers now have probed source_url\")')"
          git push
