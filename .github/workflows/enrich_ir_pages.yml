name: Enrich company data from IR pages

on:
  # Weekly, Wed 04:00 UTC = 07:00 EAT — mid-week off-cycle from the daily
  # price/scraper runs.
  schedule:
    - cron: "0 4 * * 3"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Bare tickers to target (space-separated). Blank = all curated IR URLs."
        required: false
        default: ""
      dry_run:
        description: "Skip Firestore writes"
        required: false
        default: "false"

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: |
          pip install -r pipeline/requirements.txt
          pip install --upgrade openai

      - name: Enrich from IR pages
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL:             ${{ secrets.FIREBASE_RTDB_URL }}
          FIREBASE_STORAGE_BUCKET:       ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NVIDIA_API_KEY:                ${{ secrets.NVIDIA_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ github.event.inputs.tickers }}"
          fi
          python pipeline/scripts/enrich_from_ir_pages.py $ARGS
