name: External watchlist quotes (yfinance → RTDB)

# Pulls US indices / stocks / futures quotes from Yahoo Finance and
# writes them to RTDB `watchlist/external/{SYMBOL}` so the frontend's
# TradingWorkstation can render live Last/Chg/Chg% for symbols outside
# the NSE feed. See pipeline/scripts/fetch_external_watchlist.py.

on:
  schedule:
    # Every :00 and :30 during US market hours + a small buffer either
    # side. NYSE trades 09:30-16:00 ET which is 14:30-21:00 UTC in DST
    # (13:30-20:00 UTC in standard time — we cover the wider window).
    # Mon-Fri only. 26 runs/day per ticker.
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch:

# Serialize so a slow run doesn't overlap the next tick.
concurrency:
  group: external-watchlist
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Fetch external quotes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL:             ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python pipeline/scripts/fetch_external_watchlist.py
