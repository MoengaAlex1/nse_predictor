name: Extract fundamentals from PDFs (Claude AI)

on:
  # Monthly, first of the month at 04:00 UTC = 07:00 EAT
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Bare tickers to target (space-separated). Blank = all with financials docs."
        required: false
        default: ""
      mode:
        description: "annual-only | dividends-only | both"
        required: false
        default: "both"
      all_annuals:
        description: "Process every annual/interim PDF per ticker (historical backfill). Otherwise only the latest."
        required: false
        default: "false"
      max_per_ticker:
        description: "With all_annuals, cap PDFs processed per ticker (default 20)"
        required: false
        default: "20"
      limit:
        description: "Cap on ticker count (blank = no cap)"
        required: false
        default: ""
      dry_run:
        description: "Skip Firestore writes"
        required: false
        default: "false"

jobs:
  extract:
    runs-on: ubuntu-latest
    # Historical --all-annuals runs across 61 tickers × up to 20 PDFs each
    # × ~40s per NVIDIA extraction can run 4-5 hours. Set the timeout well
    # above that; per-job max on GitHub Actions is 6 hours anyway.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: |
          pip install -r pipeline/requirements.txt
          # Ensure the anthropic SDK is present; some existing workflows
          # rely on it via analyze_financials_ai.py but pipeline/requirements
          # may not pin the latest version.
          pip install --upgrade anthropic

      - name: Extract fundamentals
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL:             ${{ secrets.FIREBASE_RTDB_URL }}
          FIREBASE_STORAGE_BUCKET:       ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NVIDIA_API_KEY:                ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          case "${{ github.event.inputs.mode }}" in
            annual-only)   ARGS="$ARGS --annual-only" ;;
            dividends-only) ARGS="$ARGS --dividends-only" ;;
          esac
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.all_annuals }}" = "true" ]; then
            ARGS="$ARGS --all-annuals --max-per-ticker ${{ github.event.inputs.max_per_ticker }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ github.event.inputs.tickers }}"
          fi
          python pipeline/scripts/extract_from_pdfs_ai.py $ARGS
