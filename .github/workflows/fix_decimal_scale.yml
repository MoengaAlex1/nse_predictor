name: Fix Decimal-Scale Price Errors

# Corrects prices whose whole row was written at the wrong decimal scale, e.g.
# EQTY 85.25 stored as 0.8525 or CIC 4.69 stored as 474.00.
#
# Manual only, dry-run by default. Every run uploads the proposed changes; a
# write run also uploads a backup that restore_from_run can replay to undo it.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "true = report only, write nothing"
        type: choice
        required: true
        default: "true"
        options: ["true", "false"]
      restore_from_run:
        description: "Run ID of an earlier write, to undo it"
        required: false
        default: ""

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch backup from the earlier run
        if: ${{ github.event.inputs.restore_from_run != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ github.event.inputs.restore_from_run }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "decimal-scale-backup-${{ github.event.inputs.restore_from_run }}" --dir .

      - name: Restore
        if: ${{ github.event.inputs.restore_from_run != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
        run: python pipeline/scripts/fix_decimal_scale.py --restore decimal_scale_backup.json 2>&1 | tee /tmp/run.log

      - name: Correct prices
        if: ${{ github.event.inputs.restore_from_run == '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
        run: |
          set -euo pipefail
          ARGS=""
          T="${{ github.event.inputs.tickers }}"
          if [ -n "$T" ]; then
            IFS=',' read -ra L <<< "$T"
            for t in "${L[@]}"; do
              ARGS="$ARGS --ticker $(echo "$t" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            done
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            ARGS="$ARGS --apply --backup decimal_scale_backup.json"
            echo "::warning::Writing to RTDB. Originals saved to the backup artifact."
          fi
          python pipeline/scripts/fix_decimal_scale.py $ARGS 2>&1 | tee /tmp/run.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Decimal-scale corrections"
            echo ""
            echo "- tickers: \`${{ github.event.inputs.tickers || 'all' }}\`"
            echo "- dry_run: \`${{ github.event.inputs.dry_run }}\`"
            echo ""
            echo '```'
            tail -40 /tmp/run.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup
        if: ${{ always() && github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: decimal-scale-backup-${{ github.run_id }}
          path: decimal_scale_backup.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decimal-scale-log-${{ github.run_id }}
          path: /tmp/run.log
          if-no-files-found: ignore
          retention-days: 30
