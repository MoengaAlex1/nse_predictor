name: Force-push all CSVs to RTDB (one-off)

# Manual workflow. Runs fill_missing_dates.py with --force-push so every
# ticker's CSV is replayed into RTDB, even those with no newly-added rows.
# Use after a change to the RTDB write shape (e.g. adding the `filled`
# flag on 2026-09-19) so existing forward-fill rows in the CSVs get
# re-pushed with the new fields.

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Force-push every ticker's CSV to RTDB
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL:             ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python pipeline/scripts/fill_missing_dates.py --force-push
