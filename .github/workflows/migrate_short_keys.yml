name: Migrate Firestore docs to short-key format

# Manually-triggered one-shot migration. Idempotent — safe to re-run.
# Use --dry-run first to see what would move, then re-run without.
#
# Scans every company in companies.json and, for each of the
# companies / financials / fundamentals collections, merges any legacy
# "SCOM.NR" or "SCOM_NR" doc into the canonical short-form "SCOM" doc.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set 'true' to audit without writing"
        required: false
        default: "true"

jobs:
  migrate:
    name: Migrate to short keys
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run migration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET:       ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          echo "Running: python pipeline/scripts/migrate_to_short_keys.py $FLAGS"
          python pipeline/scripts/migrate_to_short_keys.py $FLAGS 2>&1 | tee /tmp/migrate.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrate-short-keys-${{ github.run_id }}
          path: /tmp/migrate.log
          retention-days: 14
