name: Daily Price Audit (NSE cross-check)

on:
  schedule:
    # 17:00 UTC = 20:00 EAT — after market close and PDF scrape settle
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to audit YYYY-MM-DD (blank = today)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — show issues without patching"
        required: false
        default: "false"

jobs:
  audit:
    name: Audit price data vs NSE website
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Audit decimal errors in RTDB
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          DRY_ARG=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_ARG="--dry-run"
          python pipeline/scripts/audit_prices_vs_nse.py $DATE_ARG $DRY_ARG 2>&1 | tee /tmp/price_audit.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-audit-log-${{ github.run_id }}
          path: /tmp/price_audit.log
          retention-days: 7
