name: NSE Intraday Price Capture (every 30 min)

# Runs every 30 min through every NSE trading day (Mon–Fri, EAT = UTC+3):
#   09:00 → 15:30 EAT  (06:00 → 12:30 UTC)  = 14 runs / day
# NSE opens 09:00, closes 15:00; the 15:30 run captures the final settle.
#
# Each run:
#   Step 1 – scrape_nse_prices.py     → fetch latest prices, refresh Storage CSVs
#   Step 2 – push_intraday_prices.py  → push current_price + change_pct_today +
#                                       intraday_today + today's Volume to Firestore
#   Step 3 – backfill_most_active.py  → rewrite market_overview.most_active from
#                                       the fresh volumes so the Home page's
#                                       "Most Active" list reflects the day's
#                                       actual transactions in near real time.
#
# intraday_today accumulates {time, price} snapshots across all 14 runs so the
# "1D" chart shows a real intraday curve, not a flat line.
#
# Concurrency guard: if a run takes >30 min (rare — typical run is ~2 min) the
# next tick waits rather than piling up parallel scrapers on the same CSVs.
#
# The nightly daily_update.yml (midnight EAT) still handles full model retraining
# and buy/sell/hold signal generation — that job is not replaced by this one.

on:
  schedule:
    # Every :00 and :30 from 06:00–12:30 UTC = 09:00–15:30 EAT, Mon–Fri
    - cron: "0,30 6-12 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill date range FROM:TO (e.g. 2026-07-16:2026-07-17). Leave blank for today."
        required: false
        default: ""
      tickers:
        description: "Comma-separated tickers to update (blank = all)"
        required: false
        default: ""
      skip_firestore_push:
        description: "Set to 'true' to scrape only (skip Firestore push)"
        required: false
        default: "false"

# Serialise on the scheduled 30-min cadence so a slow run never overlaps the
# next tick. Manual dispatch (backfills, single-ticker debugs) still queues.
concurrency:
  group: nse-intraday-price-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Scrape + push prices to Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # ── Step 1: Scrape NSE prices → update Firebase Storage CSVs ─────────────
      - name: Scrape NSE prices
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NSE_TICKERS_FILTER: ${{ github.event.inputs.tickers }}
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE

          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            echo "Backfill mode: ${{ github.event.inputs.backfill }}"
            python pipeline/scripts/scrape_nse_prices.py \
              --backfill "${{ github.event.inputs.backfill }}" 2>&1 | tee /tmp/scrape.log
          else
            HOUR=$(date -u +%H)
            if   [ "$HOUR" -lt 8  ]; then SESSION="open";
            elif [ "$HOUR" -lt 12 ]; then SESSION="midday";
            else                          SESSION="close";
            fi
            echo "Session: $SESSION (UTC hour: $HOUR)"
            python pipeline/scripts/scrape_nse_prices.py \
              --session "$SESSION" 2>&1 | tee /tmp/scrape.log
          fi

      # ── Step 2: Push prices to Firestore (live website update) ───────────────
      - name: Push prices to Firestore
        if: ${{ github.event.inputs.skip_firestore_push != 'true' && github.event.inputs.backfill == '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NSE_TICKERS_FILTER: ${{ github.event.inputs.tickers }}
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE
          python pipeline/scripts/push_intraday_prices.py 2>&1 | tee /tmp/push.log

      # ── Step 3: Refresh market_overview.most_active from current volumes ─────
      # Runs 5× per trading day (once per scrape) so the Home page's Most
      # Active box tracks the day's actual transactions — SCOM at 09:00 EAT
      # with 500K shares traded might slide down by 15:00 EAT after another
      # ticker's block trade lands.
      - name: Refresh Most Active by volume
        if: ${{ github.event.inputs.skip_firestore_push != 'true' && github.event.inputs.backfill == '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE
          python pipeline/scripts/backfill_most_active.py 2>&1 | tee /tmp/most_active.log

      # ── Artifacts ─────────────────────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-capture-log-${{ github.run_id }}
          path: |
            /tmp/scrape.log
            /tmp/push.log
            /tmp/most_active.log
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Price capture failed — check artifact logs"
          echo "=== scrape.log ===" && tail -20 /tmp/scrape.log || true
          echo "=== push.log ===" && tail -20 /tmp/push.log || true
