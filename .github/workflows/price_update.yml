name: Hourly NSE Price Update

on:
  schedule:
    # Every 30 min from 09:00–15:00 EAT (06:00–12:00 UTC) Mon–Fri
    - cron: "0,30 6,7,8,9,10,11 * * 1-5"  # 06:00–11:30 UTC = 09:00–14:30 EAT
    - cron: "0 12 * * 1-5"                  # 12:00 UTC = 15:00 EAT
  workflow_dispatch:
    inputs:
      date:
        description: "Date to scrape YYYY-MM-DD (blank = today)"
        required: false
        default: ""

jobs:
  scrape:
    name: Scrape NSE PDF → RTDB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Scrape prices
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          python pipeline/scripts/scrape_nse_pdf.py $DATE_ARG 2>&1 | tee /tmp/price_update.log

      - name: Audit and fix decimal errors
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/fix_all_decimals.py 2>&1 | tee /tmp/decimal_audit.log

      - name: Detect and quarantine price anomalies
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/nse_price_cleaner.py --push-rtdb 2>&1 | tee /tmp/price_cleaner.log

      - name: Verify extracted prices (maker-checker)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/nse_data_verifier.py 2>&1 | tee /tmp/verify.log

      - name: Forward-fill missing trading days
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/fill_missing_dates.py 2>&1 | tee /tmp/fill_gaps.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-update-log-${{ github.run_id }}
          path: |
            /tmp/price_update.log
            /tmp/verify.log
          retention-days: 3
