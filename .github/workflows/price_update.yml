name: End-of-Day NSE PDF → RTDB

# Runs AFTER the NSE daily equity statistics PDF is published (~15:30 EAT).
# Fires hourly from 16:00 → 19:00 EAT so if NSE publishes late (they often
# do) a later slot will pick it up. The scrape+push_to_rtdb chain is
# idempotent — once one slot succeeds, later slots just re-write the same
# values with no harm.
#
# This is the ONLY writer to Firebase RTDB at `prices/{short}/{date}`. The
# frontend reads historical prices from RTDB (useHistoricalPrices,
# useCompareSeries), so this workflow keeps that data fresh. Do NOT retire
# it — the Firestore-based price_scrape.yml handles intraday snapshots but
# does not populate RTDB.
#
# Previous schedule (every 30 min from 09:00–15:00 EAT) generated ~12
# guaranteed 404s per day because NSE's daily PDF doesn't exist until after
# 15:00 close. New schedule keeps only slots where the PDF actually exists.

on:
  schedule:
    # 16:00, 17:00, 18:00, 19:00 EAT (13:00–16:00 UTC), Mon–Fri
    - cron: "0 13-16 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to scrape YYYY-MM-DD (blank = today)"
        required: false
        default: ""

concurrency:
  group: nse-eod-pdf-rtdb
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape NSE PDF → RTDB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Scrape prices
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          python pipeline/scripts/scrape_nse_pdf.py $DATE_ARG 2>&1 | tee /tmp/price_update.log

      - name: Audit and fix decimal errors
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/fix_all_decimals.py 2>&1 | tee /tmp/decimal_audit.log

      - name: Detect and quarantine price anomalies
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/nse_price_cleaner.py --push-rtdb 2>&1 | tee /tmp/price_cleaner.log

      - name: Verify extracted prices (maker-checker)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/nse_data_verifier.py 2>&1 | tee /tmp/verify.log

      - name: Forward-fill missing trading days
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/fill_missing_dates.py 2>&1 | tee /tmp/fill_gaps.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-update-log-${{ github.run_id }}
          path: |
            /tmp/price_update.log
            /tmp/verify.log
          retention-days: 3
