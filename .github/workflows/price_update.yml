name: Hourly NSE Price Update

on:
  schedule:
    # 12:30, 13:30, 14:30, 15:30, 16:30 UTC = 15:30–19:30 EAT Mon–Fri
    # NSE closes 15:00 EAT; PDF published ~13:00–14:00 UTC. Multiple attempts ensure we get it.
    - cron: "30 12,13,14,15,16 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to scrape YYYY-MM-DD (blank = today)"
        required: false
        default: ""

jobs:
  scrape:
    name: Scrape NSE PDF → RTDB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Scrape prices
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          python pipeline/scripts/scrape_nse_pdf.py $DATE_ARG 2>&1 | tee /tmp/price_update.log

      - name: Audit and fix decimal errors
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/fix_all_decimals.py 2>&1 | tee /tmp/decimal_audit.log

      - name: Detect and quarantine price anomalies
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/nse_price_cleaner.py --push-rtdb 2>&1 | tee /tmp/price_cleaner.log

      - name: Forward-fill missing trading days
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline/scripts/fill_missing_dates.py 2>&1 | tee /tmp/fill_gaps.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-update-log-${{ github.run_id }}
          path: /tmp/price_update.log
          retention-days: 3
