name: Rebuild prices_latest mirror

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print planned writes without touching RTDB"
        required: false
        default: "false"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install firebase-admin

      - name: Rebuild prices_latest mirror
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL:         ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m pipeline.scripts.rebuild_prices_latest --dry-run
          else
            python -m pipeline.scripts.rebuild_prices_latest
          fi
